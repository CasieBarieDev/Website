<nav class="site-nav" role="navigation" data-nav-paths='[{% for item in site.navigation %}{{ item.url | relative_url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]'>
	<input type="checkbox" id="menu-active" aria-label="Toggle navigation menu" aria-controls="navigation-menu" onchange="toggle()">
	<label for="menu-active" class="menu-btn hamburger">
		{% for i in (1..3) %}<span></span>{% endfor %}
	</label>
	<div class="wrapper" id="navigation-menu">
		<ul class="menu">
			{% for item in site.navigation %}
			{% assign class = nil %}
			{% if page.url == "/" and item.title == "HOME" %}
			{% assign class = 'current' %}
			{% elsif page.url contains item.url and item.title != "HOME" %}
			{% assign class = 'current' %}
			{% endif %}
			<li><a href="{{ item.url | relative_url }}" data-nav-index="{{ forloop.index0 }}">
				<span class="{{ class }}">{{ item.title }}</span>
			</a></li>
			{% endfor %}
		</ul>
	</div>
</nav>
